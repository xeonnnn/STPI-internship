{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ conference.name }} - Virtual Room</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://meet.jit.si">
    <link rel="preconnect" href="https://meet.jit.si" crossorigin>
    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        #jitsi-container {
            height: 100%;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }
        .back-btn {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 1000000;
            width: 44px;
            height: 44px;
            min-width: 44px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
        }

        @media (max-width: 640px) {
            .back-btn {
                top: 8px;
                left: 8px;
                width: 40px;
                height: 40px;
                min-width: 40px;
                min-height: 40px;
            }
        }
    </style>
</head>
<body class="bg-black">
    <a href="{% url 'conference:choose_conference_role' conference.id %}" class="back-btn inline-flex h-10 w-10 items-center justify-center rounded-full bg-zinc-900/75 text-white backdrop-blur transition hover:bg-zinc-800" aria-label="Back to conference" title="Back to conference">
        <i class="fas fa-arrow-left text-sm"></i>
    </a>
    <div id="jitsi-container"></div>
    {{ room_config|json_script:"room-config" }}
    <script src="{% static 'js/conference_room.js' %}"></script>
</body>
</html>
