{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ conference.name }} - Virtual Room</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src='https://meet.jit.si/external_api.js'></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
        #jitsi-container {
            height: 100vh;
            width: 100%;
        }
        .back-btn {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 1000;
        }
    </style>
</head>
<body class="bg-black">
    <a href="{% url 'conference:choose_conference_role' conference.id %}" class="back-btn inline-flex h-10 w-10 items-center justify-center rounded-full bg-zinc-900/75 text-white backdrop-blur transition hover:bg-zinc-800" aria-label="Back to conference" title="Back to conference">
        <i class="fas fa-arrow-left text-sm"></i>
    </a>
    <div id="jitsi-container"></div>

    {{ room_config|json_script:"room-config" }}
    <script src="{% static 'js/conference_room.js' %}"></script>
</body>
</html>
