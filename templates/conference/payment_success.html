{% extends 'dashboard/dashboard.html' %}
{% block content %}
<div class="container mx-auto px-4 py-16 flex justify-center">
    <div class="bg-white rounded-2xl shadow-xl p-12 max-w-lg w-full text-center">
        <div class="flex justify-center mb-6">
            <div class="bg-green-100 rounded-full p-6">
                <svg class="w-16 h-16 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                </svg>
            </div>
        </div>
        <h1 class="text-3xl font-bold text-green-700 mb-2">Payment Successful!</h1>
        <p class="text-gray-500 mb-6">Your conference paper fee has been received.</p>

        <div class="bg-gray-50 rounded-xl p-4 mb-8 text-left">
            <div class="flex justify-between py-2 border-b border-gray-200">
                <span class="text-gray-500 text-sm">Paper</span>
                <span class="font-semibold text-gray-800 text-sm">{{ paper.title }}</span>
            </div>
            <div class="flex justify-between py-2 border-b border-gray-200">
                <span class="text-gray-500 text-sm">Amount Paid</span>
                <span class="font-semibold text-green-700 text-sm">₹500</span>
            </div>
            <div class="flex justify-between py-2">
                <span class="text-gray-500 text-sm">Status</span>
                <span class="inline-flex items-center gap-1 text-green-700 font-semibold text-sm">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                    </svg>
                    Confirmed
                </span>
            </div>
        </div>

        <a href="{% url 'dashboard:dashboard' %}"
           class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-semibold px-8 py-3 rounded-xl transition">
            Go to Dashboard
        </a>
    </div>
</div>
{% endblock %}
